# Filtergruppen der Übersicht. Reihenfolge = Anzeigereihenfolge.
# Logik: ODER innerhalb einer Gruppe, UND zwischen Gruppen.
- feld: kategorie
  titel: Kategorie
  quelle: kategorien.yaml
- feld: richtung
  titel: Feedbackrichtung
  werte:
    - { id: sus-an-lehrkraft, label: "SuS → Lehrkraft", erklaerung: Feedback an die Lehrkraft }
    - { id: peer, label: "SuS ↔ SuS", erklaerung: Peer-Feedback }
    - { id: selbst, label: Selbsteinschätzung, erklaerung: SuS schätzen sich selbst ein }
