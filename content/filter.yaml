    - { id: stundenende, label: Stundenende }
    - { id: einheitsende, label: Ende einer Einheit }
    - { id: nach-praesentation, label: Nach Präsentation/Gruppenarbeit }
    - { id: dauerhaft, label: Dauerhaft }
- feld: form
  titel: Form
  werte:
