- id: feedback-hand
  titel: 'Feedback-Hand'
  inhalt: 'Umriss einer Hand, je Finger Symbol + Leitsatz (Daumen: Das war super; Zeigefinger: Das ist mir aufgefallen; Mittelfinger: Das hat mir nicht gefallen; Ringfinger: Das nehme ich mit; kleiner Finger: Das kam zu kurz) und Schreibfeld'
  seiten: '1'
  status: fertig

- id: ampelkarten
  titel: 'Ampelkarten'
  inhalt: '3 Karten pro SuS (rot/gelb/grün) im Format A7; zusätzlich Text "Hilfe" / "unsicher" / "verstanden" für SW-Druck; 4 Sätze pro Seite'
  seiten: '3 (je Farbe 1)'
  status: fertig

- id: smiley-karten
  titel: 'Smiley-Karten'
  inhalt: '3 Kreise (lachend, neutral, traurig), A6, 4 pro Seite, gemischt'
  seiten: '1'
  status: fertig

- id: wettersymbole
  titel: 'Wettersymbole'
  inhalt: '4 große Symbole (Sonne, Sonne mit Wolke, Wolke, Gewitter) je A4 quer für die Tafel + Seite mit Mini-Karten (A7)'
  seiten: '5'
  status: fertig

- id: eckenschilder
  titel: 'Eckenschilder'
  inhalt: '4 Schilder A4 quer: großer Buchstabe A–D + leeres Feld für Aussage'
  seiten: '4'
  status: fertig

- id: zielscheibe
  titel: 'Zielscheibe'
  inhalt: 'Konzentrische Kreise (4 Ringe), 6 Segmente mit leeren Beschriftungsfeldern; Variante A4 (Einzel) und A3-taugliche Plakatversion'
  seiten: '1–2'
  status: fertig

- id: skalen-plakat
  titel: 'Skalen-Plakat'
  inhalt: 'Waagerechte Skala 1–6 mit Feldern für Klebepunkte; Bodenkarten "1"–"6" (A5)'
  seiten: '4'
  status: fertig

- id: lernrad
  titel: 'Lernrad'
  inhalt: 'Kreis mit 6–8 Segmenten, von innen nach außen in 4 Stufen unterteilt, Felder für Themennamen'
  seiten: '1'
  status: annahme

- id: wimmelbild
  titel: 'Wimmelbild'
