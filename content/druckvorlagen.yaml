  seiten: '1'
  status: fertig

- id: exit-ticket
  titel: 'Exit-Ticket'
  inhalt: '4 Tickets pro A4: Name (optional), Datum, "Das habe ich gelernt", "Das ist mir unklar", Feld für Kontrollaufgabe; Variante 3-2-1'
  seiten: '2'
  status: fertig

- id: reflexionskarten
  titel: 'Reflexionskarten'
  inhalt: '12 Karten (A7) mit Satzanfängen: Am meisten geholfen hat mir … / Schwierig war … / Nächstes Mal mache ich … / Überrascht hat mich … / Ich bin stolz auf … / Ich brauche noch … / Am besten gelernt habe ich durch … / Das will ich noch wissen … / Unsere Zusammenarbeit war … / Mein Ziel war … / Das nehme ich mit … / Joker'
  seiten: '1'
  status: fertig

- id: wuerfelnetz
  titel: 'Reflexionswürfel'
  inhalt: 'Würfelnetz mit Klebelaschen, Seiten: Was war neu? / Was war schwer? / Was hat Spaß gemacht? / Was willst du noch wissen? / Wie hast du gearbeitet? / Joker; zweite Seite leeres Netz'
  seiten: '2'
  status: fertig

- id: fragebogen
  titel: 'Unterrichts-Fragebogen'
  inhalt: '8 Aussagen mit Skala 1–4 (z. B. "Die Aufgaben waren verständlich", "Ich konnte Fragen stellen", "Das Tempo war passend", "Ich weiß, was ich lernen soll") + 2 offene Fragen (Was soll bleiben? Was soll sich ändern?)'
  seiten: '1'
  status: fertig

- id: sterne-wunsch-karte
  titel: '2 Sterne + ein Wunsch'
  inhalt: '4 Karten pro A4: 2 Sternfelder, 1 Wunschfeld, "Feedback für:"'
  seiten: '1'
  status: fertig

- id: www-karte
  titel: 'WWW-Karte'
  inhalt: '4 Karten pro A4 mit Satzanfängen Wahrnehmung / Wirkung / Wunsch; zusätzlich Plakat A4 zum Aufhängen'
  seiten: '2'
  status: fertig

- id: burger
  titel: 'Burger-Methode'
  inhalt: 'Burger aus 3 Ebenen mit Schreibfeldern (Lob – Tipp – Lob)'
